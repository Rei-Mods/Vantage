# Publishing a GitHub release (tag vX.Y.Z) builds vantage.zip and attaches it with a module.json
# whose version / download point at that release, so Foundry's "manifest URL" install and updates just work.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${{ github.repository }}/releases/download/${TAG}/vantage.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Zip the module
        run: zip -r vantage.zip module.json LICENSE README.md CHANGELOG.md scripts styles lang

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" vantage.zip module.json --clobber
