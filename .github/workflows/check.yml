# Quick sanity checks on every push / pull request: JavaScript syntax, JSON files parse.
name: Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in scripts/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: JSON
        run: for f in module.json lang/*.json; do jq empty "$f" || exit 1; done
